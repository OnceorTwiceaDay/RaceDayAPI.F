# Local development stack. The default Azurite credentials below are public emulator
# credentials ONLY; never reuse them with a real Azure Storage account.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    volumes:
      - sql_data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RaceDay__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RaceDayDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      # Inside Docker, localhost is this container, so use the Azurite service name.
      # Override with a real cloud connection string in .env if required.
      AzureStorage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_started
      azurite:
        condition: service_healthy

  mvc:
    build:
      context: .
      dockerfile: RaceDay.MVC/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RaceDayApi__BaseUrl: "http://api:8080/"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  sql_data:
  azurite_data:
