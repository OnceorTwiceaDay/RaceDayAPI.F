name: RaceDay API and MVC Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Compile MVC project
        run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal
