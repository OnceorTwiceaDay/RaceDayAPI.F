name: RaceDay API and MVC Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate Docker Compose settings
        env:
          MSSQL_SA_PASSWORD: "CI-OnlyStrongPassword123!"
        run: docker compose config --quiet

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Compile MVC project
        run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore

      - name: Build MVC Docker image
        run: docker build -f RaceDay.MVC/Dockerfile -t raceday-mvc-ci .

      - name: Start local Azurite Blob emulator
        run: |
          docker run -d --name raceday-azurite -p 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0
          for attempt in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:10000/; then
              echo "Azurite Blob service is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs raceday-azurite
          exit 1

      - name: Run API and MVC tests (including Azurite round trips)
        env:
          RACEDAY_AZURITE_TESTS: "1"
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal
